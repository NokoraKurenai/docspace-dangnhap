<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - DocSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header GIỐNG HỆT trang chủ -->
    <header>
        <nav>
            <a href="index.html" class="logo">DocSpace</a>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <ul class="nav-links" id="nav-links">
                <li><a href="index.html#features">Tính năng</a></li>
                <li><a href="index.html#how-it-works">Cách hoạt động</a></li>
                <li><a href="index.html#pricing">Bảng giá</a></li>
                <li><a href="index.html#faq">FAQ</a></li>
                <li><a href="index.html#contact">Liên hệ</a></li>
                
                <!-- Mobile Auth Buttons -->
                <div class="mobile-auth">
                    <a href="https://nokorakurenai.github.io/docspace-dangnhap" class="btn btn-login">Đăng nhập</a>
                    <a href="https://nokorakurenai.github.io/docspace-dangky" class="btn btn-signup">Đăng ký</a>
                </div>
            </ul>

            <!-- Desktop Auth Buttons -->
            <div class="auth-buttons desktop-auth">
                <a href="https://nokorakurenai.github.io/docspace-dangnhap" class="btn btn-login">Đăng nhập</a>
                <a href="https://nokorakurenai.github.io/docspace-dangky" class="btn btn-signup">Đăng ký</a>
            </div>
        </nav>
    </header>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1>Đăng nhập tài khoản</h1>
                    <p>Chào mừng trở lại! Vui lòng đăng nhập để tiếp tục</p>
                </div>

                <!-- Social Login Buttons -->
                <div class="social-auth">
                    <button class="btn-social btn-google">
                        <i class="fab fa-google"></i>
                        Đăng nhập với Google
                    </button>
                    <button class="btn-social btn-facebook">
                        <i class="fab fa-facebook-f"></i>
                        Đăng nhập với Facebook
                    </button>
                </div>

                <div class="auth-divider">
                    <span>hoặc đăng nhập với email</span>
                </div>

                <!-- Login Form -->
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Mật khẩu *</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu của bạn">
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="passwordError"></div>
                    </div>

                    <div class="form-options">
                        <div class="checkbox-group">
                            <label class="checkbox-container">
                                <input type="checkbox" id="remember" name="remember">
                                <span class="checkmark"></span>
                                <span class="checkbox-text">Ghi nhớ đăng nhập</span>
                            </label>
                        </div>
                        <a href="forgot-password.html" class="forgot-password">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-login-submit" id="submitBtn">
                        <span class="btn-text">Đăng nhập</span>
                        <div class="btn-loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </button>
                </form>

                <div class="login-footer">
                    <p>Chưa có tài khoản? <a href="https://nokorakurenai.github.io/docspace-dangky" class="text-link">Đăng ký ngay</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/login.js"></script>
</body>

</html>
